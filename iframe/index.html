<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Label Maker Pro</title>
		<style>
			:root {
				color-scheme: light;
				--bg: #f3f6fa;
				--panel: #ffffff;
				--field: #ffffff;
				--line: #ccd7e4;
				--text: #192b3c;
				--text-soft: #465e74;
				--button: #e8eef5;
				--button-hover: #dce7f3;
				--primary: #086ac8;
				--primary-hover: #0556a5;
				--focus: #126fc4;
				--danger-bg: #ffebeb;
				--danger: #a02727;
				--danger-line: #e5bcbc;
				--status-bg: #edf5ff;
				--status-text: #1f4f84;
				--status-line: #c4daf2;
				--preview-bg: #f9fbff;
				--grid: #e9eff7;
				--silk: #172c42;
			}

			:root[data-theme="dark"] {
				color-scheme: dark;
				--bg: #282a2d;
				--panel: #34363a;
				--field: #292b2f;
				--line: #565b63;
				--text: #f2f3f5;
				--text-soft: #c0c5cd;
				--button: #454951;
				--button-hover: #525965;
				--primary: #1769b4;
				--primary-hover: #155d9f;
				--focus: #7ebeff;
				--danger-bg: #4a2c30;
				--danger: #ffc0c1;
				--danger-line: #89545a;
				--status-bg: #26394d;
				--status-text: #c6e2ff;
				--status-line: #476380;
				--preview-bg: #222428;
				--grid: #303339;
				--silk: #e5ecf5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 12px;
				background: var(--bg);
				color: var(--text);
				font: 13px/1.4 "Segoe UI", "Tahoma", sans-serif;
			}

			.app {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
			}

			.title {
				font-size: 18px;
				font-weight: 600;
				margin: 0;
			}

			.subtitle {
				margin: 0;
				color: var(--text-soft);
				font-size: 12px;
			}

			.panel {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 10px;
				display: grid;
				gap: 10px;
			}

			.row {
				display: grid;
				gap: 8px;
			}

			.row.cols-2 {
				grid-template-columns: 1fr 1fr;
			}

			.row.cols-3 {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}

			label {
				display: grid;
				gap: 4px;
				font-size: 12px;
				color: var(--text-soft);
			}

			input,
			select,
			button {
				font: inherit;
			}

			input,
			select {
				width: 100%;
				padding: 7px 8px;
				border: 1px solid var(--line);
				border-radius: 7px;
				background: var(--field);
				color: var(--text);
			}

			.hstack {
				display: flex;
				gap: 8px;
				align-items: end;
			}

			.hstack > * {
				flex: 1;
				min-width: 0;
			}

			.tools {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
			}

			.tools button {
				flex: 1;
				min-width: 80px;
			}

			.preview-wrap {
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--bg);
				padding: 8px;
				display: grid;
				gap: 6px;
				min-width: 0;
			}

			#previewCanvas {
				display: block;
				width: 100%;
				height: 152px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background:
					linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 16px 16px,
					linear-gradient(0deg, var(--grid) 1px, transparent 1px) 0 0 / 16px 16px,
					var(--preview-bg);
			}

			.preview-meta {
				color: var(--text-soft);
				font-size: 12px;
			}

			.actions {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			button {
				border: 0;
				border-radius: 8px;
				padding: 8px 11px;
				cursor: pointer;
				background: var(--button);
				color: var(--text);
			}

			button:not(:disabled):hover {
				background: var(--button-hover);
			}

			:focus-visible {
				outline: 2px solid var(--focus);
				outline-offset: 2px;
			}

			button.primary {
				background: var(--primary);
				color: #fff;
				font-weight: 600;
			}

			button.primary:not(:disabled):hover {
				background: var(--primary-hover);
			}

			button.danger {
				background: var(--danger-bg);
				color: var(--danger);
			}

			button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			.status {
				border-radius: 8px;
				padding: 8px 10px;
				font-size: 12px;
				background: var(--status-bg);
				color: var(--status-text);
				border: 1px solid var(--status-line);
			}

			.status.error {
				background: var(--danger-bg);
				color: var(--danger);
				border-color: var(--danger-line);
			}

			.corner-settings {
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 7px 9px;
			}

			.corner-settings summary {
				cursor: pointer;
				font-weight: 600;
			}

			.corner-grid {
				display: flex;
				gap: 8px;
				margin-top: 8px;
			}

			.corner-side {
				flex: 1;
				min-width: 0;
			}

			.hint {
				margin: 6px 0 0;
				color: var(--text-soft);
				font-size: 12px;
			}

			dialog {
				width: min(340px, calc(100% - 24px));
				padding: 16px;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--panel);
				color: var(--text);
			}

			dialog::backdrop {
				background: rgb(0 0 0 / 45%);
			}

			dialog .actions {
				margin-top: 12px;
				justify-content: flex-end;
			}

			[hidden] {
				display: none !important;
			}

			@media (max-width: 420px) {
				.hstack,
				.corner-grid {
					flex-direction: column;
					align-items: stretch;
				}

				.row.cols-3 {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
		</style>
	</head>
	<body>
		<div class="app">
			<header class="header">
				<div>
					<h1 class="title">Label Maker Pro</h1>
					<p class="subtitle">Shaped labels with text cutout. All dimensions are in mil.</p>
				</div>
			</header>

			<div class="panel">
				<div class="row">
					<div class="hstack">
						<label>
							Preset
							<select id="presetSelect"></select>
						</label>
						<div class="tools">
							<button id="savePresetBtn" type="button">Save As</button>
							<button id="updatePresetBtn" type="button">Update</button>
							<button id="deletePresetBtn" class="danger" type="button">Delete</button>
						</div>
					</div>
				</div>

				<div class="row cols-3">
					<label>
						Left Shape
						<select id="leftShape"></select>
					</label>
					<label>
						Label Text
						<input id="labelText" type="text" maxlength="80" placeholder="GND" />
					</label>
					<label>
						Right Shape
						<select id="rightShape"></select>
					</label>
				</div>

				<details id="cornerSettings" class="corner-settings" hidden>
					<summary>Corner radii (mil)</summary>
					<div class="corner-grid">
						<div id="leftCorners" class="corner-side row cols-2">
							<label>Top-left <input id="topLeft" type="number" min="0" step="any" inputmode="decimal" /></label>
							<label>Bottom-left <input id="bottomLeft" type="number" min="0" step="any" inputmode="decimal" /></label>
						</div>
						<div id="rightCorners" class="corner-side row cols-2">
							<label>Top-right <input id="topRight" type="number" min="0" step="any" inputmode="decimal" /></label>
							<label>Bottom-right <input id="bottomRight" type="number" min="0" step="any" inputmode="decimal" /></label>
						</div>
					</div>
					<p class="hint" id="cornerHint">0 keeps the corner square.</p>
				</details>

				<div class="row cols-3">
					<label>
						Font
						<select id="fontFamily"></select>
					</label>
					<label>
						Weight
						<select id="fontWeight">
							<option value="400">400 Regular</option>
							<option value="500">500 Medium</option>
							<option value="600">600 SemiBold</option>
							<option value="700">700 Bold</option>
							<option value="800">800 ExtraBold</option>
						</select>
					</label>
					<label>
						Layer
						<select id="layer">
							<option value="3">Top Silkscreen</option>
							<option value="4">Bottom Silkscreen</option>
						</select>
					</label>
				</div>

				<div class="row">
					<div class="hstack">
						<label>
							Quality
							<select id="quality">
								<option value="ultra">Ultra Smooth</option>
								<option value="balanced">Balanced</option>
								<option value="fast">Fast</option>
							</select>
						</label>
						<div class="tools">
							<button id="addFontBtn" type="button">Add Font Name</button>
							<button id="importFontBtn" type="button">Load Font File</button>
						</div>
					</div>
				</div>

				<div class="row cols-3">
					<label>
						Font Size
						<input id="fontSize" type="number" step="1" min="2" max="1000" />
					</label>
					<label>
						Padding X
						<input id="paddingX" type="number" step="1" min="-200" max="1000" />
					</label>
					<label>
						Padding Y
						<input id="paddingY" type="number" step="1" min="-200" max="1000" />
					</label>
				</div>

				<div class="row cols-3">
					<label>
						Width (0 = Auto)
						<input id="labelWidth" type="number" step="1" min="0" max="20000" />
					</label>
					<label>
						Align
						<select id="textAlign">
							<option value="left">Left</option>
							<option value="center">Center</option>
							<option value="right">Right</option>
						</select>
					</label>
					<label>
						Bottom Mirror
						<select id="mirror">
							<option value="false">No</option>
							<option value="true">Yes</option>
						</select>
					</label>
				</div>

				<div class="preview-wrap">
					<canvas id="previewCanvas" aria-label="Silkscreen label preview"></canvas>
					<div class="preview-meta" id="previewMeta">Label size: -- x -- mil</div>
				</div>

				<div class="actions">
					<button id="placeBtn" class="primary" type="button">Place Label</button>
					<button id="closeBtn" type="button">Close</button>
				</div>

				<div class="status" id="statusLine" role="status">Ready. Click Place Label to start.</div>
			</div>
		</div>

		<dialog id="actionDialog" aria-labelledby="actionMessage">
			<form method="dialog">
				<label>
					<span id="actionMessage"></span>
					<input id="actionValue" type="text" />
				</label>
				<div class="actions">
					<button value="cancel">Cancel</button>
					<button id="actionConfirm" value="confirm" class="primary">OK</button>
				</div>
			</form>
		</dialog>

		<script>
			(() => {
				const STORAGE_OPTIONS_KEY = 'labelMaker.options.v1';
				const STORAGE_PRESETS_KEY = 'labelMaker.presets.v1';
				const IFRAME_ID = 'label-maker-pro-window';
				const MIN_POLYGON_AREA_MIL2 = 0.6;
				const MAX_RASTER_SIDE = 8192;
				const MAX_RASTER_PIXELS = 16_000_000;
				const QUALITY_PROFILES = {
					ultra: {
						rasterScale: 12,
						tolerance: 0.05,
						simplification: 0,
						smoothing: 1.28,
						despeckling: 0,
						binarize: false,
					},
					balanced: {
						rasterScale: 5,
						tolerance: 0.2,
						simplification: 0.1,
						smoothing: 0.95,
						despeckling: 0.3,
						binarize: false,
					},
					fast: {
						rasterScale: 3,
						tolerance: 0.3,
						simplification: 0.2,
						smoothing: 0.45,
						despeckling: 1,
						binarize: true,
					},
				};

				const SHAPES = ['(', ')', '<', '>', '/', '\\', '|', '[', ']'];
				const CORNERS = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'];
				const DEFAULT_OPTIONS = {
					leftShape: '(',
					rightShape: ')',
					topLeft: 0,
					topRight: 0,
					bottomLeft: 0,
					bottomRight: 0,
					text: 'GND',
					font: 'Arial',
					fontWeight: 700,
					size: 55,
					paddingX: 10,
					paddingY: 6,
					width: 0,
					textAlign: 'center',
					layer: 3,
					mirror: false,
					quality: 'ultra',
				};

				const elements = {
					presetSelect: document.getElementById('presetSelect'),
					savePresetBtn: document.getElementById('savePresetBtn'),
					updatePresetBtn: document.getElementById('updatePresetBtn'),
					deletePresetBtn: document.getElementById('deletePresetBtn'),
					leftShape: document.getElementById('leftShape'),
					rightShape: document.getElementById('rightShape'),
					cornerSettings: document.getElementById('cornerSettings'),
					leftCorners: document.getElementById('leftCorners'),
					rightCorners: document.getElementById('rightCorners'),
					cornerHint: document.getElementById('cornerHint'),
					topLeft: document.getElementById('topLeft'),
					topRight: document.getElementById('topRight'),
					bottomLeft: document.getElementById('bottomLeft'),
					bottomRight: document.getElementById('bottomRight'),
					labelText: document.getElementById('labelText'),
					fontFamily: document.getElementById('fontFamily'),
					fontWeight: document.getElementById('fontWeight'),
					layer: document.getElementById('layer'),
					quality: document.getElementById('quality'),
					addFontBtn: document.getElementById('addFontBtn'),
					importFontBtn: document.getElementById('importFontBtn'),
					fontSize: document.getElementById('fontSize'),
					paddingX: document.getElementById('paddingX'),
					paddingY: document.getElementById('paddingY'),
					labelWidth: document.getElementById('labelWidth'),
					textAlign: document.getElementById('textAlign'),
					mirror: document.getElementById('mirror'),
					previewCanvas: document.getElementById('previewCanvas'),
					previewMeta: document.getElementById('previewMeta'),
					placeBtn: document.getElementById('placeBtn'),
					closeBtn: document.getElementById('closeBtn'),
					statusLine: document.getElementById('statusLine'),
					actionDialog: document.getElementById('actionDialog'),
					actionMessage: document.getElementById('actionMessage'),
					actionValue: document.getElementById('actionValue'),
					actionConfirm: document.getElementById('actionConfirm'),
				};

				const previewContext = elements.previewCanvas.getContext('2d');
				const measureCanvas = document.createElement('canvas');
				const measureContext = measureCanvas.getContext('2d');
				const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

				let placing = false;
				let presetMap = Object.assign(Object.create(null), { Default: DEFAULT_OPTIONS });
				let fontsList = ['Arial'];
				const runtimeFontFaces = new Map();
				const fontMetricCache = new Map();
				let previewFrameHandle = null;
				let floatingPlacement = null;
				let optionsWrite = Promise.resolve();
				let savingPreset = false;
				const FLOAT_PLACE_EVENT_ID = 'labelmaker-pro-float-place-click';
				let systemFontsLoaded = false;
				let syncingTheme = false;

				function setStatus(message, isError = false) {
					elements.statusLine.textContent = message;
					elements.statusLine.classList.toggle('error', Boolean(isError));
				}

				async function syncTheme() {
					if (syncingTheme) return;
					syncingTheme = true;
					let theme;
					try {
						theme = await window.eda?.sys_Window?.getCurrentTheme?.();
					} catch {
						// Follow the OS when the host cannot report its theme.
					} finally {
						syncingTheme = false;
					}
					const next = theme === 'dark' || theme === 'light' ? theme : (systemTheme.matches ? 'dark' : 'light');
					if (document.documentElement.dataset.theme !== next) {
						document.documentElement.dataset.theme = next;
						requestRenderPreview();
					}
				}

				function askUser(message, initialValue, confirmLabel = 'OK') {
					const { actionDialog, actionMessage, actionValue, actionConfirm } = elements;
					actionMessage.textContent = message;
					actionValue.hidden = initialValue === undefined;
					actionValue.value = initialValue ?? '';
					actionConfirm.textContent = confirmLabel;
					actionDialog.returnValue = '';
					return new Promise((resolve) => {
						actionDialog.addEventListener('close', () => {
							resolve(actionDialog.returnValue === 'confirm' ? actionValue.value : null);
						}, { once: true });
						actionDialog.showModal();
						if (!actionValue.hidden) {
							actionValue.focus();
							actionValue.select();
						}
					});
				}

				function isSquareCap(shape) {
					return shape === '|' || shape === '[' || shape === ']';
				}

				function updateControlAvailability(options) {
					const left = isSquareCap(options.leftShape);
					const right = isSquareCap(options.rightShape);
					elements.cornerSettings.hidden = !left && !right;
					elements.leftCorners.hidden = !left;
					elements.rightCorners.hidden = !right;
					elements.mirror.disabled = options.layer !== 4;
				}

				function clampNumber(value, minimum, maximum, fallback) {
					const n = Number(value);
					if (!Number.isFinite(n)) {
						return fallback;
					}
					return Math.min(maximum, Math.max(minimum, n));
				}

				function sanitizeOptions(raw) {
					const next = { ...DEFAULT_OPTIONS };
					if (!raw || typeof raw !== 'object') {
						return next;
					}

					if (SHAPES.includes(raw.leftShape)) next.leftShape = raw.leftShape;
					if (SHAPES.includes(raw.rightShape)) next.rightShape = raw.rightShape;
					for (const corner of CORNERS) {
						next[corner] = clampNumber(raw[corner], 0, 20000, 0);
					}
					next.text = typeof raw.text === 'string' ? raw.text.slice(0, 80) : next.text;
					next.font = typeof raw.font === 'string' && raw.font.length ? raw.font : next.font;
					const weight = Number(raw.fontWeight);
					if ([400, 500, 600, 700, 800].includes(weight)) next.fontWeight = weight;
					next.size = clampNumber(raw.size, 2, 1000, next.size);
					next.paddingX = clampNumber(raw.paddingX, -200, 1000, next.paddingX);
					next.paddingY = clampNumber(raw.paddingY, -200, 1000, next.paddingY);
					next.width = clampNumber(raw.width, 0, 20000, next.width);
					next.textAlign = ['left', 'center', 'right'].includes(raw.textAlign) ? raw.textAlign : next.textAlign;
					next.layer = Number(raw.layer) === 4 ? 4 : 3;
					next.mirror = raw.mirror === true || raw.mirror === 'true';
					next.quality = ['ultra', 'balanced', 'fast'].includes(raw.quality) ? raw.quality : next.quality;
					return next;
				}

				function getFormOptions() {
					return sanitizeOptions({
						leftShape: elements.leftShape.value,
						rightShape: elements.rightShape.value,
						topLeft: elements.topLeft.value,
						topRight: elements.topRight.value,
						bottomLeft: elements.bottomLeft.value,
						bottomRight: elements.bottomRight.value,
						text: elements.labelText.value,
						font: elements.fontFamily.value,
						fontWeight: elements.fontWeight.value,
						size: elements.fontSize.value,
						paddingX: elements.paddingX.value,
						paddingY: elements.paddingY.value,
						width: elements.labelWidth.value,
						textAlign: elements.textAlign.value,
						layer: elements.layer.value,
						mirror: elements.mirror.value === 'true',
						quality: elements.quality.value,
					});
				}

				function setFormOptions(options) {
					elements.leftShape.value = options.leftShape;
					elements.rightShape.value = options.rightShape;
					for (const corner of CORNERS) {
						elements[corner].value = String(options[corner]);
					}
					elements.labelText.value = options.text;
					refreshFontSelect(options.font);
					elements.fontWeight.value = String(options.fontWeight);
					elements.fontSize.value = String(options.size);
					elements.paddingX.value = String(options.paddingX);
					elements.paddingY.value = String(options.paddingY);
					elements.labelWidth.value = String(options.width);
					elements.textAlign.value = options.textAlign;
					elements.layer.value = String(options.layer);
					elements.mirror.value = String(options.mirror);
					elements.quality.value = options.quality;
					updateControlAvailability(options);
				}

				function populateShapeSelects() {
					const optionsHtml = SHAPES.map((shape) => `<option value="${shape}">${shape}</option>`).join('');
					elements.leftShape.innerHTML = optionsHtml;
					elements.rightShape.innerHTML = optionsHtml;
				}

				function ensureFontInList(fontName) {
					if (!fontName || fontsList.includes(fontName)) {
						return;
					}
					fontsList.push(fontName);
					fontsList.sort((a, b) => a.localeCompare(b));
				}

				function refreshFontSelect(selectedFont) {
					ensureFontInList(selectedFont);
					elements.fontFamily.replaceChildren(...fontsList.map((font) => new Option(font, font)));
					elements.fontFamily.value = selectedFont;
				}

				async function loadFonts() {
					try {
						if (window.eda?.sys_FontManager?.getFontsList) {
							const fonts = await eda.sys_FontManager.getFontsList();
							if (Array.isArray(fonts) && fonts.length > 0) {
								fontsList = Array.from(new Set(fonts.filter((font) => typeof font === 'string' && font.trim())));
							}
						}
					} catch (error) {
						console.warn('loadFonts failed', error);
					}

					if (!systemFontsLoaded && typeof window.queryLocalFonts === 'function') {
						try {
							const localFonts = await window.queryLocalFonts();
							if (Array.isArray(localFonts) && localFonts.length > 0) {
								for (const item of localFonts) {
									if (item?.fullName) {
										fontsList.push(String(item.fullName).trim());
									}
									if (item?.family) {
										fontsList.push(String(item.family).trim());
									}
								}
							}
							systemFontsLoaded = true;
						} catch (error) {
							console.warn('queryLocalFonts unavailable', error);
						}
					}

					if (!fontsList.length) {
						fontsList = ['Arial', 'Liberation Sans', 'Tahoma'];
					}
					for (const runtimeFamily of runtimeFontFaces.keys()) {
						if (!fontsList.includes(runtimeFamily)) {
							fontsList.push(runtimeFamily);
						}
					}
					fontsList = Array.from(new Set(fontsList.filter(Boolean)));
					fontsList.sort((a, b) => a.localeCompare(b));
					fontMetricCache.clear();
				}

				async function addFontByName() {
					const fontNameRaw = await askUser('Enter the exact system font name.', '');
					if (fontNameRaw === null) {
						return;
					}
					const fontName = fontNameRaw.trim();
					if (!fontName) {
						setStatus('Font name cannot be empty.', true);
						return;
					}
					try {
						if (window.eda?.sys_FontManager?.addFont) {
							const ok = await eda.sys_FontManager.addFont(fontName);
							if (!ok) {
								throw new Error('FontManager rejected this font name.');
							}
						}
						await loadFonts();
						refreshFontSelect(fontName);
						handleOptionChanged();
						saveCurrentOptions();
						setStatus(`Font "${fontName}" added.`);
					} catch (error) {
						console.error(error);
						setStatus(`Add font failed: ${error.message || error}`, true);
					}
				}

				async function importFontFromFile() {
					try {
						if (!window.eda?.sys_FileSystem?.openReadFileDialog) {
							throw new Error('File API is not available.');
						}
						const file = await eda.sys_FileSystem.openReadFileDialog(['ttf', 'otf', 'woff', 'woff2'], false);
						if (!file) {
							return;
						}
						const fallbackName = (file.name || 'CustomFont').replace(/\.[^.]+$/, '');
						const familyRaw = await askUser('Font family name for this session', fallbackName);
						if (familyRaw === null) {
							return;
						}
						const family = familyRaw.trim();
						if (!family) {
							setStatus('Font family name cannot be empty.', true);
							return;
						}
						const data = await file.arrayBuffer();
						const fontFace = new FontFace(family, data);
						await fontFace.load();
						const previousFont = runtimeFontFaces.get(family);
						if (previousFont) document.fonts.delete(previousFont);
						document.fonts.add(fontFace);
						runtimeFontFaces.set(family, fontFace);
						fontMetricCache.clear();
						refreshFontSelect(family);
						handleOptionChanged();
						saveCurrentOptions();
						setStatus(`Runtime font "${family}" loaded.`);
					} catch (error) {
						console.error(error);
						setStatus(`Load font file failed: ${error.message || error}`, true);
					}
				}

				function measureStableFontMetrics(fontSpec, fontSizePx) {
					const cacheKey = `${fontSpec}::${fontSizePx.toFixed(3)}`;
					const cached = fontMetricCache.get(cacheKey);
					if (cached) {
						return cached;
					}

					measureContext.font = fontSpec;
					const reference = measureContext.measureText('HgQy');
					const ascentPx = Math.max(1, reference.fontBoundingBoxAscent || reference.actualBoundingBoxAscent || fontSizePx * 0.8);
					const descentPx = Math.max(1, reference.fontBoundingBoxDescent || reference.actualBoundingBoxDescent || fontSizePx * 0.22);
					const stable = { ascentPx, descentPx };
					fontMetricCache.set(cacheKey, stable);
					return stable;
				}

				function createRenderModel(options) {
					const text = options.text.trim();
					const fontFamily = options.font.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
					const fontSpec = `${options.fontWeight} ${options.size}px "${fontFamily}"`;
					measureContext.font = fontSpec;
					const metrics = measureContext.measureText(text);
					const textWidthPx = Math.max(1, metrics.width || 1);
					const { ascentPx, descentPx } = measureStableFontMetrics(fontSpec, options.size);
					const textHeightPx = Math.max(1, ascentPx + descentPx);

					const innerWidthPx = Math.max(1, options.width, textWidthPx + options.paddingX * 2);
					const heightMil = Math.max(1, textHeightPx + options.paddingY * 2);
					const capDepthPx = heightMil / 2;
					const widthMil = innerWidthPx + capDepthPx * 2;

					const xLeftOut = 0;
					const xLeftMid = capDepthPx / 2;
					const xLeftIn = capDepthPx;
					const xRightIn = xLeftIn + innerWidthPx;
					const xRightMid = xRightIn + capDepthPx / 2;
					const xRightOut = widthMil;
					const yTop = 0;
					const yBottom = heightMil;
					const yMid = capDepthPx;

					let textX = xLeftIn + innerWidthPx / 2;
					let textCanvasAlign = 'center';
					if (options.textAlign === 'left') {
						textX = xLeftIn + options.paddingX;
						textCanvasAlign = 'left';
					} else if (options.textAlign === 'right') {
						textX = xRightIn - options.paddingX;
						textCanvasAlign = 'right';
					}
					const textY = yMid + (ascentPx - descentPx) / 2;

					// Keep fillets within their end cap so a flat side can meet any opposite shape.
					const radii = {};
					for (const corner of CORNERS) {
						const shape = corner.endsWith('Left') ? options.leftShape : options.rightShape;
						radii[corner] = isSquareCap(shape) ? Math.min(options[corner], capDepthPx) : 0;
					}

					return {
						text,
						fontSpec,
						textX,
						textY,
						textCanvasAlign,
						widthMil,
						heightMil,
						radii,
						mirror: options.layer === 4 && options.mirror,
						bounds: {
							xLeftOut,
							xLeftMid,
							xLeftIn,
							xRightIn,
							xRightMid,
							xRightOut,
							yTop,
							yMid,
							yBottom,
						},
						leftShape: options.leftShape,
						rightShape: options.rightShape,
					};
				}

				function drawRightCap(ctx, model) {
					const b = model.bounds;
					const radius = (b.yBottom - b.yTop) / 2;
					switch (model.rightShape) {
						case '|':
						case '[':
						case ']':
							ctx.moveTo(b.xRightOut - model.radii.topRight, b.yTop);
							ctx.arcTo(b.xRightOut, b.yTop, b.xRightOut, b.yBottom, model.radii.topRight);
							ctx.arcTo(b.xRightOut, b.yBottom, b.xLeftOut, b.yBottom, model.radii.bottomRight);
							break;
						case '/':
							ctx.moveTo(b.xRightOut, b.yTop);
							ctx.lineTo(b.xRightMid, b.yBottom);
							break;
						case '\\':
							ctx.moveTo(b.xRightMid, b.yTop);
							ctx.lineTo(b.xRightOut, b.yBottom);
							break;
						case '>':
							ctx.moveTo(b.xRightMid, b.yTop);
							ctx.lineTo(b.xRightOut, b.yMid);
							ctx.lineTo(b.xRightMid, b.yBottom);
							break;
						case '<':
							ctx.moveTo(b.xRightOut, b.yTop);
							ctx.lineTo(b.xRightMid, b.yMid);
							ctx.lineTo(b.xRightOut, b.yBottom);
							break;
						case '(':
							ctx.moveTo(b.xRightOut, b.yTop);
							ctx.arc(b.xRightOut, b.yMid, radius, -Math.PI / 2, Math.PI / 2, true);
							break;
						case ')':
						default:
							ctx.moveTo(b.xRightIn, b.yTop);
							ctx.arc(b.xRightIn, b.yMid, radius, -Math.PI / 2, Math.PI / 2, false);
							break;
					}
				}

				function drawLeftCap(ctx, model) {
					const b = model.bounds;
					const radius = (b.yBottom - b.yTop) / 2;
					switch (model.leftShape) {
						case '|':
						case '[':
						case ']':
							ctx.lineTo(b.xLeftOut + model.radii.bottomLeft, b.yBottom);
							ctx.arcTo(b.xLeftOut, b.yBottom, b.xLeftOut, b.yTop, model.radii.bottomLeft);
							ctx.arcTo(b.xLeftOut, b.yTop, b.xRightOut, b.yTop, model.radii.topLeft);
							break;
						case '/':
							ctx.lineTo(b.xLeftOut, b.yBottom);
							ctx.lineTo(b.xLeftMid, b.yTop);
							break;
						case '\\':
							ctx.lineTo(b.xLeftMid, b.yBottom);
							ctx.lineTo(b.xLeftOut, b.yTop);
							break;
						case '<':
							ctx.lineTo(b.xLeftMid, b.yBottom);
							ctx.lineTo(b.xLeftOut, b.yMid);
							ctx.lineTo(b.xLeftMid, b.yTop);
							break;
						case '>':
							ctx.lineTo(b.xLeftOut, b.yBottom);
							ctx.lineTo(b.xLeftMid, b.yMid);
							ctx.lineTo(b.xLeftOut, b.yTop);
							break;
						case ')':
							ctx.lineTo(b.xLeftOut, b.yBottom);
							ctx.arc(b.xLeftOut, b.yMid, radius, Math.PI / 2, -Math.PI / 2, true);
							break;
						case '(':
						default:
							ctx.lineTo(b.xLeftIn, b.yBottom);
							ctx.arc(b.xLeftIn, b.yMid, radius, Math.PI / 2, -Math.PI / 2, false);
							break;
					}
				}

				function drawLabel(ctx, model, ink, whiteBackground) {
					ctx.beginPath();
					drawRightCap(ctx, model);
					drawLeftCap(ctx, model);
					ctx.closePath();
					ctx.fillStyle = ink;
					ctx.fill();

					ctx.save();
					ctx.globalCompositeOperation = whiteBackground ? 'source-over' : 'destination-out';
					ctx.clip();
					ctx.fillStyle = '#ffffff';
					ctx.font = model.fontSpec;
					ctx.textAlign = model.textCanvasAlign;
					ctx.textBaseline = 'alphabetic';
					ctx.fillText(model.text, model.textX, model.textY);
					ctx.restore();
				}

				function renderPreview() {
					const options = getFormOptions();
					const model = createRenderModel(options);
					const canvas = elements.previewCanvas;
					const density = window.devicePixelRatio || 1;
					const width = Math.round(canvas.clientWidth * density);
					const height = Math.round(canvas.clientHeight * density);
					if (width <= 24 * density || height <= 24 * density) return;
					if (canvas.width !== width || canvas.height !== height) {
						canvas.width = width;
						canvas.height = height;
					}
					const inset = 24 * density;
					const scale = Math.min((width - inset) / model.widthMil, (height - inset) / model.heightMil);
					previewContext.clearRect(0, 0, width, height);
					previewContext.save();
					previewContext.translate((width - model.widthMil * scale) / 2, (height - model.heightMil * scale) / 2);
					if (model.mirror) {
						previewContext.translate(model.widthMil * scale, 0);
					}
					previewContext.scale(model.mirror ? -scale : scale, scale);
					const ink = getComputedStyle(canvas).getPropertyValue('--silk').trim();
					drawLabel(previewContext, model, ink, false);
					previewContext.restore();

					elements.previewMeta.textContent = `Label size: ${model.widthMil.toFixed(1)} × ${model.heightMil.toFixed(1)} mil${model.mirror ? ' · mirrored' : ''}`;
					const limited = CORNERS.filter((corner) => model.radii[corner] > 0 && model.radii[corner] < options[corner]);
					elements.cornerHint.textContent = limited.length
						? `Large radii are limited to ${(model.heightMil / 2).toFixed(2)} mil (half the label height).`
						: '0 keeps the corner square. The maximum radius is half the label height.';
				}

				function requestRenderPreview() {
					if (previewFrameHandle !== null) {
						cancelAnimationFrame(previewFrameHandle);
					}
					previewFrameHandle = requestAnimationFrame(() => {
						previewFrameHandle = null;
						renderPreview();
					});
				}

				function saveCurrentOptions() {
					if (!window.eda?.sys_Storage?.setExtensionUserConfig) return;
					const options = getFormOptions();
					optionsWrite = optionsWrite
						.then(() => eda.sys_Storage.setExtensionUserConfig(STORAGE_OPTIONS_KEY, options))
						.catch((error) => console.warn('saveCurrentOptions failed', error));
				}

				function getSortedPresetNames() {
					return Object.keys(presetMap).sort((a, b) => {
						if (a === 'Default') return -1;
						if (b === 'Default') return 1;
						return a.localeCompare(b);
					});
				}

				function refreshPresetSelect(selectedName) {
					const names = getSortedPresetNames();
					elements.presetSelect.replaceChildren(...names.map((name) => new Option(name, name)));

					const fallback = names.includes(selectedName) ? selectedName : 'Default';
					elements.presetSelect.value = fallback;
					elements.updatePresetBtn.disabled = fallback === 'Default';
					elements.deletePresetBtn.disabled = fallback === 'Default';
				}

				async function commitPresetMap(next, selectedName, message) {
					if (savingPreset) return;
					savingPreset = true;
					const { Default: _defaultPreset, ...customPresets } = next;
					try {
						if (window.eda?.sys_Storage?.setExtensionUserConfig
							&& !await eda.sys_Storage.setExtensionUserConfig(STORAGE_PRESETS_KEY, customPresets)) {
							throw new Error('EasyEDA did not save the presets.');
						}
						presetMap = next;
						refreshPresetSelect(selectedName);
						setStatus(message);
					} catch (error) {
						setStatus(`Preset change failed: ${error.message || error}`, true);
					} finally {
						savingPreset = false;
					}
				}

				async function loadSettings() {
					let loadedOptions = null;
					let loadedPresets = null;

					try {
						if (window.eda?.sys_Storage?.getExtensionUserConfig) {
							loadedOptions = await eda.sys_Storage.getExtensionUserConfig(STORAGE_OPTIONS_KEY);
							loadedPresets = await eda.sys_Storage.getExtensionUserConfig(STORAGE_PRESETS_KEY);
						}
					} catch (error) {
						console.warn('loadSettings failed', error);
					}

					if (loadedPresets && typeof loadedPresets === 'object') {
						for (const [name, value] of Object.entries(loadedPresets)) {
							if (typeof name === 'string' && name.trim() && name !== 'Default') {
								presetMap[name] = sanitizeOptions(value);
							}
						}
					}

					const options = sanitizeOptions(loadedOptions);
					setFormOptions(options);
					refreshPresetSelect('Default');
				}

				async function saveAsPreset() {
					const nameRaw = await askUser('Preset name', '');
					if (nameRaw === null) {
						return;
					}
					const name = nameRaw.trim();
					if (!name) {
						setStatus('Preset name cannot be empty.', true);
						return;
					}
					if (Object.hasOwn(presetMap, name)) {
						setStatus('A preset with this name already exists. Use Update to overwrite a custom preset.', true);
						return;
					}
					const next = Object.assign(Object.create(null), presetMap, { [name]: getFormOptions() });
					await commitPresetMap(next, name, `Preset "${name}" saved.`);
				}

				async function updatePreset() {
					const selected = elements.presetSelect.value;
					if (!selected || selected === 'Default') {
						setStatus('Default preset cannot be overwritten.', true);
						return;
					}
					const next = Object.assign(Object.create(null), presetMap, { [selected]: getFormOptions() });
					await commitPresetMap(next, selected, `Preset "${selected}" updated.`);
				}

				async function deletePreset() {
					const selected = elements.presetSelect.value;
					if (!selected || selected === 'Default') {
						setStatus('Default preset cannot be deleted.', true);
						return;
					}
					if (await askUser(`Delete preset "${selected}"?`, undefined, 'Delete') === null) {
						return;
					}

					const next = Object.assign(Object.create(null), presetMap);
					delete next[selected];
					await commitPresetMap(next, 'Default', `Preset "${selected}" removed.`);
				}

				function applySelectedPreset() {
					const name = elements.presetSelect.value;
					const preset = presetMap[name];
					if (!preset) {
						return;
					}
					setFormOptions(sanitizeOptions(preset));
					requestRenderPreview();
					void saveCurrentOptions();
					elements.updatePresetBtn.disabled = name === 'Default';
					elements.deletePresetBtn.disabled = name === 'Default';
					setStatus(`Preset "${name}" loaded.`);
				}

				function handleOptionChanged() {
					updateControlAvailability(getFormOptions());
					requestRenderPreview();
				}

				function normalizePolygonArray(rawPolygon) {
					const normalized = [];
					for (const token of rawPolygon) {
						if (token === 'L') {
							normalized.push('L');
						} else if (typeof token === 'number' && Number.isFinite(token)) {
							normalized.push(token);
						}
					}
					return normalized;
				}

				function canvasToBlob(canvas) {
					return new Promise((resolve, reject) => {
						canvas.toBlob((blob) => {
							if (blob) {
								resolve(blob);
							} else {
								reject(new Error('Failed to convert canvas to blob.'));
							}
						}, 'image/png');
					});
				}

				function binarizeCanvas(context, threshold = 150) {
					const { width, height } = context.canvas;
					const imageData = context.getImageData(0, 0, width, height);
					const data = imageData.data;
					for (let i = 0; i < data.length; i += 4) {
						const luminance = (data[i] + data[i + 1] + data[i + 2]) / 3;
						const value = luminance >= threshold ? 255 : 0;
						data[i] = value;
						data[i + 1] = value;
						data[i + 2] = value;
						data[i + 3] = 255;
					}
					context.putImageData(imageData, 0, 0);
				}

				function polygonAreaMil2(polygon) {
					const points = [];
					let x = null;
					for (const token of polygon) {
						if (token === 'L') {
							continue;
						}
						if (typeof token !== 'number') {
							continue;
						}
						if (x === null) {
							x = token;
							continue;
						}
						points.push([x, token]);
						x = null;
					}
					if (points.length < 3) {
						return 0;
					}
					let sum = 0;
					for (let i = 0; i < points.length; i += 1) {
						const [x1, y1] = points[i];
						const [x2, y2] = points[(i + 1) % points.length];
						sum += x1 * y2 - x2 * y1;
					}
					return Math.abs(sum / 2);
				}

				function extractPolygonSource(polygonData) {
					if (!polygonData) {
						return [];
					}
					if (Array.isArray(polygonData.complexPolygon)) {
						return polygonData.complexPolygon;
					}
					if (typeof polygonData.getSourceStrictComplex === 'function') {
						const source = polygonData.getSourceStrictComplex();
						if (Array.isArray(source)) {
							return source;
						}
					}
					if (typeof polygonData.getSource === 'function') {
						const source = polygonData.getSource();
						if (Array.isArray(source)) {
							if (source.length && Array.isArray(source[0])) {
								return source;
							}
							return [source];
						}
					}
					return [];
				}

				async function buildLabelImageData(options) {
					const qualityProfile = QUALITY_PROFILES[options.quality] || QUALITY_PROFILES.ultra;
					const model = createRenderModel(options);
					if (model.widthMil > 10000 || model.heightMil > 5000) {
						throw new Error('Label is too large. Reduce size or width.');
					}
					const scale = Math.min(
						qualityProfile.rasterScale,
						MAX_RASTER_SIDE / Math.max(model.widthMil, model.heightMil),
						Math.sqrt(MAX_RASTER_PIXELS / (model.widthMil * model.heightMil)),
					);
					const canvas = document.createElement('canvas');
					canvas.width = Math.ceil(model.widthMil * scale);
					canvas.height = Math.ceil(model.heightMil * scale);
					const context = canvas.getContext('2d');

					context.fillStyle = '#ffffff';
					context.fillRect(0, 0, canvas.width, canvas.height);
					context.save();
					context.scale(canvas.width / model.widthMil, canvas.height / model.heightMil);
					drawLabel(context, model, '#000000', true);
					context.restore();
					if (qualityProfile.binarize) {
						binarizeCanvas(context);
					}
					const imageBlob = await canvasToBlob(canvas);
					const polygonData = await eda.pcb_MathPolygon.convertImageToComplexPolygon(
						imageBlob,
						model.widthMil,
						model.heightMil,
						qualityProfile.tolerance,
						qualityProfile.simplification,
						qualityProfile.smoothing,
						qualityProfile.despeckling,
						true,
						false,
					);

					const polygonSource = extractPolygonSource(polygonData);
					if (!polygonSource.length) {
						throw new Error('Label contour generation failed.');
					}

					const polygons = polygonSource
						.map(normalizePolygonArray)
						.filter((polygon) => polygon.length >= 6)
						.filter((polygon) => polygonAreaMil2(polygon) >= MIN_POLYGON_AREA_MIL2);
					if (!polygons.length) {
						throw new Error('No valid polygon was generated.');
					}
					const maxContours = options.quality === 'ultra' ? 900 : options.quality === 'balanced' ? 500 : 280;
					if (polygons.length > maxContours) {
						throw new Error('Generated too many contours. Try lower quality or reduce label detail.');
					}

					// PrimitiveImage works best with the native object returned by convertImageToComplexPolygon.
					// Keep width/height from the render model for placement geometry.
					return {
						complexPolygon: polygonData,
						width: model.widthMil,
						height: model.heightMil,
						mirror: model.mirror,
					};
				}

				function toTopLeft(position, width, height) {
					return {
						x: position.x - width / 2,
						y: position.y + height / 2,
					};
				}

				async function updateFloatingPlacementPosition(placement) {
					try {
						const pointer = await eda.pcb_SelectControl.getCurrentMousePosition();
						if (floatingPlacement !== placement || !pointer || !Number.isFinite(pointer.x) || !Number.isFinite(pointer.y)) {
							return;
						}
						const topLeft = toTopLeft(pointer, placement.width, placement.height);
						if (topLeft.x === placement.position.x && topLeft.y === placement.position.y) return;
						if (await eda.pcb_PrimitiveImage.modify(placement.primitiveId, topLeft)) {
							placement.position = topLeft;
						}
					} catch (error) {
						console.error('floating placement update failed', error);
					}
				}

				async function finishFloatingPlacement(cancel, showWindow = true) {
					const placement = floatingPlacement;
					if (!placement) return;
					floatingPlacement = null;
					clearInterval(placement.timer);
					placement.removeEscListener();
					try {
						eda.pcb_Event.removeEventListener(FLOAT_PLACE_EVENT_ID);
					} catch (error) {
						console.warn('Remove placement listener failed', error);
					}
					try {
						await placement.pending;
						if (cancel && !await eda.pcb_PrimitiveImage.delete(placement.primitiveId)) {
							throw new Error('EasyEDA could not remove the temporary label.');
						}
						setStatus(cancel ? 'Placement canceled.' : 'Label placed successfully.');
					} catch (error) {
						setStatus(`Placement failed: ${error.message || error}`, true);
						eda.sys_Message?.showToastMessage?.(elements.statusLine.textContent, 'error', 4);
					}
					if (showWindow) {
						await eda.sys_IFrame.showIFrame(IFRAME_ID);
						elements.labelText.focus();
						elements.labelText.select();
					}
				}

				function attachFloatingEscListener() {
					const escHandler = (event) => {
						if (!floatingPlacement) {
							return;
						}
						const isEscape = event.key === 'Escape' || event.code === 'Escape' || event.keyCode === 27;
						if (!isEscape) {
							return;
						}
						event.preventDefault();
						event.stopPropagation();
						void finishFloatingPlacement(true);
					};
					const targets = [];
					const register = (target) => {
						if (!target || typeof target.addEventListener !== 'function') {
							return;
						}
						try {
							target.addEventListener('keydown', escHandler, true);
							targets.push(target);
						} catch (error) {
							console.warn('register esc listener failed', error);
						}
					};
					register(window);
					register(document);
					try {
						if (window.top && window.top !== window) {
							register(window.top);
							if (window.top.document) {
								register(window.top.document);
							}
						}
					} catch (error) {
						console.debug('top window esc listener unavailable', error);
					}
					return () => {
						for (const target of targets) {
							try {
								target.removeEventListener('keydown', escHandler, true);
							} catch (error) {
								console.warn('unregister esc listener failed', error);
							}
						}
					};
				}

				function startFloatingPlacement(primitiveId, width, height, position) {
					const placement = { primitiveId, width, height, position, pending: null };
					placement.removeEscListener = attachFloatingEscListener();
					floatingPlacement = placement;
					placement.timer = setInterval(() => {
						if (!placement.pending) {
							placement.pending = updateFloatingPlacementPosition(placement)
								.finally(() => { placement.pending = null; });
						}
					}, 28);
					eda.pcb_Event.addMouseEventListener(
						FLOAT_PLACE_EVENT_ID,
						'selected',
						() => finishFloatingPlacement(false),
						true,
					);
				}

				async function placeLabel() {
					if (placing) {
						return;
					}
					if (!window.eda?.pcb_MathPolygon || !window.eda?.pcb_PrimitiveImage || !window.eda?.pcb_SelectControl) {
						setStatus('PCB API is not available in this editor context.', true);
						return;
					}
					if (floatingPlacement) {
						setStatus('Finish current floating placement with one click on PCB.', true);
						return;
					}
					const options = getFormOptions();
					if (!options.text.trim()) {
						setStatus('Enter label text before placing.', true);
						elements.labelText.focus();
						return;
					}

					placing = true;
					elements.placeBtn.disabled = true;
					elements.closeBtn.disabled = true;
					setStatus('Generating label...');

					try {
						await new Promise((resolve) => {
							setTimeout(resolve, 16);
						});
						const imageData = await buildLabelImageData(options);

						const pointer = await eda.pcb_SelectControl.getCurrentMousePosition();
						if (!pointer || !Number.isFinite(pointer.x) || !Number.isFinite(pointer.y)) {
							throw new Error('Cannot read current mouse position.');
						}

						await eda.pcb_Layer.selectLayer(options.layer);
						const topLeft = toTopLeft(pointer, imageData.width, imageData.height);
						const created = await eda.pcb_PrimitiveImage.create(
							topLeft.x,
							topLeft.y,
							imageData.complexPolygon,
							options.layer,
							imageData.width,
							imageData.height,
							0,
							imageData.mirror,
							false,
						);
						if (!created) {
							throw new Error('Image primitive creation failed.');
						}

						setStatus('Move cursor on PCB and click once to place. Press Esc to cancel.');
						saveCurrentOptions();
						startFloatingPlacement(created.getState_PrimitiveId(), imageData.width, imageData.height, topLeft);
						if (!await eda.sys_IFrame.hideIFrame(IFRAME_ID)) {
							throw new Error('EasyEDA could not hide the settings window.');
						}
						if (eda.sys_Message?.showToastMessage) {
							eda.sys_Message.showToastMessage('Move cursor and click once to place label. Press Esc to cancel.', 'info', 3);
						}
					} catch (error) {
						if (floatingPlacement) await finishFloatingPlacement(true, false);
						console.error(error);
						setStatus(`Place failed: ${error.message || error}`, true);
						if (eda.sys_Message?.showToastMessage) {
							eda.sys_Message.showToastMessage(`Place failed: ${error.message || error}`, 'error', 4);
						}
					} finally {
						placing = false;
						elements.placeBtn.disabled = false;
						elements.closeBtn.disabled = false;
					}
				}

				function closeWindow() {
					if (window.eda?.sys_IFrame?.closeIFrame) {
						void eda.sys_IFrame.closeIFrame(IFRAME_ID);
					} else {
						window.close();
					}
				}

				function bindEvents() {
					const optionControls = [
						elements.leftShape,
						elements.rightShape,
						...CORNERS.map((corner) => elements[corner]),
						elements.labelText,
						elements.fontFamily,
						elements.fontWeight,
						elements.layer,
						elements.quality,
						elements.fontSize,
						elements.paddingX,
						elements.paddingY,
						elements.labelWidth,
						elements.textAlign,
						elements.mirror,
					];

					for (const control of optionControls) {
						control.addEventListener('input', handleOptionChanged);
						control.addEventListener('change', () => {
							if (control.type === 'number') {
								const key = { fontSize: 'size', labelWidth: 'width' }[control.id] || control.id;
								control.value = String(getFormOptions()[key]);
							}
							handleOptionChanged();
							saveCurrentOptions();
						});
					}

					elements.labelText.addEventListener('keydown', (event) => {
						if (event.key === 'Enter') {
							event.preventDefault();
							void placeLabel();
						}
					});

					elements.presetSelect.addEventListener('change', applySelectedPreset);
					elements.savePresetBtn.addEventListener('click', () => {
						void saveAsPreset();
					});
					elements.updatePresetBtn.addEventListener('click', () => {
						void updatePreset();
					});
					elements.deletePresetBtn.addEventListener('click', () => {
						void deletePreset();
					});
					elements.addFontBtn.addEventListener('click', () => {
						void addFontByName();
					});
					elements.importFontBtn.addEventListener('click', () => {
						void importFontFromFile();
					});
					elements.placeBtn.addEventListener('click', () => {
						void placeLabel();
					});
					elements.closeBtn.addEventListener('click', closeWindow);
				}

				async function bootstrap() {
					document.documentElement.dataset.theme = systemTheme.matches ? 'dark' : 'light';
					void syncTheme();
					systemTheme.addEventListener('change', syncTheme);
					window.addEventListener('focus', syncTheme);
					// The extension API exposes the current theme but no theme-change event.
					setInterval(syncTheme, 1500);
					populateShapeSelects();
					await loadFonts();
					await loadSettings();
					bindEvents();
					new ResizeObserver(requestRenderPreview).observe(elements.previewCanvas);
					renderPreview();
					elements.labelText.focus();
					elements.labelText.select();
				}

				void bootstrap();
			})();
		</script>
	</body>
</html>
